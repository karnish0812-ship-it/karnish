<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 50px 200px 50px;
        }
        .header{
            grid-column: 1 / 10;
            background-color: rgb(70, 8, 29);
            border-radius: 10px;
        }
        .sidebar{
            background-color: rgb(1, 81, 92);
        }
        .main{
            background-color: rgb(1, 16, 99);
        }
        .footer{
            grid-column-start: 1;
            grid-column-end: 3;
            background-color: rgb(65, 28, 65);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header"></header>
        <aside class="sidebar"></aside>
        <main class="main"></main>
        <footer class="footer"></footer>
    
</body>
</html>
