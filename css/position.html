<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 200vh;
        }
        .navbar{
            position:sticky;
            top: 0;
        }
        .relative{
            border: 2px solid rgb(4, 54, 6);
            position:relative;
            height: 50vh;
            margin-top: 20vh;
        }
        .absolute{
            border: 2px solid rgb(202, 18, 34);
            position: absolute;
            margin: 10px;
            margin-top: 50px;
            
        }
        .fixed{
            position: fixed;
        
        }
    </style>
</head>
<body>
    <div class="navbar">
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
                <li>Service</li>
            </ul>
        </nav>
    </div>
    <div class="relative">
        <h1>relative</h1>
        <div class="absolute">
            <h1>absolute</h1>
        </div>
    </div>
    <div class="fixed">fixed</div>
</body>
</html>
